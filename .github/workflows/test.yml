name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test

      # Per-vault UUPS proxies are upgraded independently, so a layout change that looks harmless
      # in one deployment can corrupt another. Fails on any reorder/retype/removal; append-only
      # changes are accepted by re-running with --update and reviewing the diff in the PR.
      - name: Check storage layout (upgradeable contracts)
        run: |
          tools/storage-layout.sh
        id: storage-layout
